[project]
name = "tradealign-ai"
version = "2.0.0"
description = "Automated Indian market (BSE) corporate announcement ingestion and Gemini AI brief pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "google-genai>=1.0.0",
    "apscheduler>=3.11.0",
    "aiosmtplib>=3.0.2",
    "streamlit>=1.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]